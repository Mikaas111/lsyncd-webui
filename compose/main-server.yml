# Main server: web UI + live sync.
services:
  lsyncd-webui:
    image: ghcr.io/mikaas111/lsyncd-webui:latest
    container_name: lsyncd-webui
    network_mode: host
    restart: unless-stopped
    environment:
      ROLE: main
      WEBUI_PORT: "8484"
      WEBUI_PASSWORD: ""
      TZ: Europe/Amsterdam
    volumes:
      # All of /mnt, so shares that are shortcuts to a pool (such as appdata) work too
      - /mnt:/mnt:ro
      # Only written for folders set to two-way; leave out if you only mirror
      - /mnt:/mnt-rw
      - /mnt/user/appdata/lsyncd-webui:/config
